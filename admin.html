<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | CARTA ROYALE</title><link rel="stylesheet" href="style.css"><main><h1>♠ ADMINISTRADOR</h1><div class="panel"><p>Código da sala: <strong class="big" id="code"></strong></p><div class="links"><a id="tv" target="_blank">📺 Abrir TV</a><a id="phone" target="_blank">📱 Link dos jogadores</a></div><p id="status"></p><div id="players" class="players"></div><p><button onclick="act('start')">▶ Iniciar partida</button><button onclick="act('restart')">↻ Reiniciar partida</button></p><p class="muted small">O administrador deve usar o navegador onde criou a sala.</p><p id="error"></p></div></main><script src="common.js"></script><script>
$('code').textContent=room();$('tv').href='tv.html?room='+room();$('phone').href='celular.html?room='+room();async function act(a){try{await api(a);await refresh()}catch(e){error(e)}}async function refresh(){try{let s=await state();$('status').textContent=s.finished?'🏆 Vencedor: '+s.finished:s.started?'Partida em andamento':'Aguardando jogadores';$('players').innerHTML=s.players.map((p,i)=>`<div class="player">${p.name}<br>${p.count} cartas</div>`).join('');}catch(e){error(e)}}refresh();setInterval(refresh,1800)
</script></html>
