<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogador | CARTA ROYALE</title><link rel="stylesheet" href="style.css"><main class="center"><h1>♠ CARTA ROYALE</h1><p>Sala: <strong id="code"></strong></p><section class="panel" id="join"><h2>Entrar na partida</h2><input id="name" maxlength="18" placeholder="Seu nome"><button onclick="join()">Entrar</button></section><section class="panel" id="game" style="display:none"><p id="status" class="big"></p><div id="top" class="cards"></div><p id="color"></p><div id="hand" class="cards"></div><div id="pick" style="display:none"><h2>Escolha a cor</h2><div class="colorpick"><button class="red" onclick="playColor('red')">V</button><button class="blue" onclick="playColor('blue')">A</button><button class="green" onclick="playColor('green')">V</button><button class="yellow" onclick="playColor('yellow')">A</button></div></div><button id="draw" onclick="act('draw')">🃏 Comprar carta e passar</button><button id="uno" onclick="act('uno')">📣 ÚLTIMA CARTA!</button></section><p id="error"></p></main><script src="common.js"></script><script>
$('code').textContent=room();let selected=null;async function join(){try{let j=await api('join',{name:$('name').value});localStorage.setItem('cr_token_'+room(),j.token);await refresh()}catch(e){error(e)}}async function act(a){try{await api(a);$('error').textContent='';await refresh()}catch(e){error(e)}}async function play(idx){try{let s=await state(),c=s.hand[idx];if(c.c==='wild'){selected=idx;$('pick').style.display='block'}else{await api('play',{index:idx});await refresh()}}catch(e){error(e)}}async function playColor(c){try{await api('play',{index:selected,color:c});$('pick').style.display='none';selected=null;await refresh()}catch(e){error(e)}}async function refresh(){try{let s=await state();$('join').style.display=s.me===null?'block':'none';$('game').style.display=s.me===null?'none':'block';if(s.me===null)return;let mine=s.players[s.me],turn=s.started&&!s.finished&&s.turn===s.me;$('status').textContent=s.finished?'🏆 '+s.finished+' venceu!':!s.started?'Aguardando o administrador iniciar':turn?'🎯 SUA VEZ!':'Aguarde sua vez';$('top').innerHTML=s.top?card(s.top):'';$('color').textContent=s.color?'Cor atual: '+({red:'VERMELHO',blue:'AZUL',green:'VERDE',yellow:'AMARELO'}[s.color]):'';$('hand').innerHTML=(s.hand||[]).map((c,i)=>`<button ${!turn?'disabled':''} onclick="play(${i})">${card(c)}</button>`).join('');$('draw').disabled=!turn;$('draw').textContent=s.pending_draw&&turn?'🃏 Comprar '+s.pending_draw+' cartas':'🃏 Comprar carta e passar';$('uno').disabled=!s.started||!!s.finished||mine.count!==1||mine.uno}catch(e){error(e)}}refresh();setInterval(refresh,1500)
</script></html>
