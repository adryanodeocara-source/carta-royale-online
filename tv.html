<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV | CARTA ROYALE</title><link rel="stylesheet" href="style.css"><main class="center"><h1>♠ CARTA ROYALE</h1><p>Sala <strong id="code"></strong> • <span id="status"></span></p><div id="players" class="players"></div><div class="panel tabletop"><div><div id="top" class="cards"></div><div class="big" id="color"></div><p id="deck"></p></div></div><div class="panel"><h2>Últimas jogadas</h2><div id="logs"></div></div><p id="error"></p></main><script src="common.js"></script><script>
$('code').textContent=room();const cname={red:'VERMELHO',blue:'AZUL',green:'VERDE',yellow:'AMARELO'};async function refresh(){try{let s=await state();$('status').textContent=s.finished?'🏆 '+s.finished+' venceu!':s.started?'Em andamento':'Aguardando início';$('players').innerHTML=s.players.map((p,i)=>`<div class="player ${i===s.turn&&s.started&&!s.finished?'active':''}"><div class="big">${p.name}</div>🃏 ${p.count} cartas ${p.uno?' • ÚLTIMA CARTA!':''}</div>`).join('');$('top').innerHTML=s.top?card(s.top):'<p>Esperando cartas...</p>';$('color').textContent=s.color?'Cor atual: '+cname[s.color]:'';$('deck').textContent='Monte: '+s.deck_count+' cartas';$('logs').innerHTML=s.logs.slice().reverse().map(x=>'<p>'+x+'</p>').join('')}catch(e){error(e)}}refresh();setInterval(refresh,1400)
</script></html>
